plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.tadakuro.salesnotes'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.tadakuro.salesnotes'
        minSdk 24
        targetSdk 34
        // Injected from CI:  -PversionCode=<run_number> -PversionName=<tag>
        versionCode providers.gradleProperty('versionCode').getOrElse('1').toInteger()
        versionName providers.gradleProperty('versionName').getOrElse('1.0.0-dev')
    }

    signingConfigs {
        // Release key from CI env (ANDROID_KEYSTORE_PATH etc.). Falls back to
        // the debug key only when the env is absent (local dev builds).
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            signingConfig System.getenv('ANDROID_KEYSTORE_PATH') ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
