name: Build APK

# Verification build on every main push touching the app;
# use "Run workflow" with a tag to publish the APK to Releases.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'android/**'
      - 'worker/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish APK to Releases under this tag (e.g. v1.0.0). Empty = build only.'
        required: false
        default: ''
      prerelease:
        description: 'Mark the GitHub Release as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APK_NAME: ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (preinstalled on runner)
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare WebView assets (account-login build, no site key needed)
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
        run: |
          set -e
          TAG="${{ inputs.release_tag }}"
          if [ -n "$TAG" ]; then VER="${TAG#v}"; else VER="dev.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION_NAME=$VER" >> "$GITHUB_ENV"
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp site/index.html site/app.js site/style.css android/app/src/main/assets/www/
          cd android/app/src/main/assets/www
          # Local files: drop cache-buster queries (asset loader has no query support).
          sed -i 's|style.css?v=__BUILD_ID__|style.css|; s|app.js?v=__BUILD_ID__|app.js|' index.html
          if grep -q "__BUILD_ID__" index.html; then echo "build id strip failed"; exit 1; fi
          # Only the sync URL is injected: auth is 100% account tokens.
          # (__SITE_KEY_HASH__ stays a placeholder — no APK code path reads it.)
          URL_ESC=$(printf '%s' "${SYNC_URL:-}" | sed 's/[&|]/\\&/g')
          sed -i "s|__SYNC_URL__|${URL_ESC}|g" app.js
          if grep -q "__SYNC_URL__" app.js; then echo "sync url injection failed"; exit 1; fi
          # App version shown in Lainnya → Yang baru.
          sed -i "s/__APP_VERSION__/${VER}/g" app.js
          if grep -q "__APP_VERSION__" app.js; then echo "app version injection failed"; exit 1; fi
          echo "assets ready (version $VER)"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
          echo "ANDROID_KEYSTORE_PATH=/tmp/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release APK (release-signed, non-debuggable)
        working-directory: android
        run: gradle :app:assembleRelease -PversionCode="$GITHUB_RUN_NUMBER" -PversionName="$VERSION_NAME" --stacktrace

      - name: Rename APK
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -n "$TAG" ]; then NAME="sales-notes-${TAG}.apk"; else NAME="sales-notes-dev-r${GITHUB_RUN_NUMBER}.apk"; fi
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          ls -lh "$NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Publish to Release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          NOTES="## Sales Notes ${TAG}
          Android app for your shop's sales notes (offline-first, account login, sync included).
          ### Isi
          - 3 shift (Pagi / Siang / Lembur, bisa on/off per akun), Cash vs QRIS, statistik + riwayat
          - Cari produk dari tab Jual (ketik nama → ketuk → form terisi)
          - Sinkron multi-perangkat via Cloudflare Worker + D1
          ### Install
          1. Download \`${APK_NAME}\` di bawah, buka di HP Android (min Android 7.0)
          2. Izinkan *Install unknown apps* saat diminta (peringatan standar untuk aplikasi di luar Play Store — pilih Install anyway)
          3. Daftar/Masuk dengan akunmu
          > Pindah dari versi debug lama (v1.0–v1.2)? Uninstall dulu versi lamanya (beda package), lalu Export JSON di app lama → Import di app baru supaya data ikut pindah. Mulai v1.3.0 APK release-signed dengan kunci tetap, jadi update berikutnya tinggal install menimpa.
          "
          if [ "${{ inputs.prerelease }}" = "true" ]; then PRE="--prerelease"; else PRE=""; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" "$APK_NAME" --title "Sales Notes $TAG" --notes "$NOTES" $PRE
          fi
